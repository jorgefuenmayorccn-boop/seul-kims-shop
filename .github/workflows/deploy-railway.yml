name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - { name: "seul-kims-tienda", rootdir: "apps/web" }
          - { name: "seul-kims-pos", rootdir: "apps/pos" }
          - { name: "seul-kims-admin", rootdir: "apps/cerebro" }
          - { name: "seul-kims-delivery", rootdir: "apps/repartidor" }

    steps:
      - uses: actions/checkout@v4

      - name: Deploy ${{ matrix.service.name }} to Railway
        run: |
          npm install -g @railway/cli

          # Set Railway token
          export RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN }}

          # Deploy service
          railway up --service "${{ matrix.service.name }}" "${{ matrix.service.rootdir }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
