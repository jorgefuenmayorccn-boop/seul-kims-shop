name = "seul-kims-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:3000"

# KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_ID"

[[kv_namespaces]]
binding = "CARTS"
id = "REPLACE_WITH_CARTS_KV_ID"

# R2 Buckets
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "seul-kims-pdfs"

# Queues (cola DTE)
[[queues.producers]]
binding = "DTE_QUEUE"
queue = "seul-kims-dte"

[[queues.consumers]]
queue = "seul-kims-dte"
max_batch_size = 10
max_batch_timeout = 30

# Secrets (set via wrangler secret put):
# DATABASE_URL
# DTE_API_KEY
# DTE_RUT_EMPRESA
# UPSTASH_REDIS_URL
# UPSTASH_REDIS_TOKEN
# SENTRY_DSN
