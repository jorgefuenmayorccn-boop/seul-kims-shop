name = "seul-kims-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT     = "development"
APP_URL         = "http://localhost:3000"
PUBLIC_API_URL  = "http://localhost:8787"

# KV — simulado localmente en dev (wrangler crea .wrangler/state/)
[[kv_namespaces]]
binding = "SESSIONS"
id      = "local-sessions-dev"

[[kv_namespaces]]
binding = "CARTS"
id      = "local-carts-dev"

# R2 — simulado localmente (comentado: R2 no está habilitado en Cloudflare free tier)
# [[r2_buckets]]
# binding     = "PDF_BUCKET"
# bucket_name = "seul-kims-pdfs-dev"

# Durable Objects — OrderHub singleton para eventos realtime (SSE → POS)
[[durable_objects.bindings]]
name       = "ORDER_HUB"
class_name = "OrderHub"

[[migrations]]
tag         = "v1"
new_classes = ["OrderHub"]

# Queue — simulado localmente
[[queues.producers]]
binding = "DTE_QUEUE"
queue   = "seul-kims-dte"

[[queues.consumers]]
queue             = "seul-kims-dte"
max_batch_size    = 10
max_batch_timeout = 30
max_retries       = 3

# Queue — correos transaccionales (independiente del DTE)
[[queues.producers]]
binding = "EMAIL_QUEUE"
queue   = "seul-kims-email"

[[queues.consumers]]
queue             = "seul-kims-email"
max_batch_size    = 10
max_batch_timeout = 30
max_retries       = 2

# =============================================================
# SECRETS — en dev se leen de .dev.vars automáticamente
# En producción: wrangler secret put <NOMBRE>
# =============================================================
# DATABASE_URL          — Neon PostgreSQL connection string
# DTE_API_KEY           — Token proveedor DTE (Bsale/Toku/Haulmer)
# DTE_RUT_EMPRESA       — RUT empresa Seoul Kims
# UPSTASH_REDIS_URL     — Redis URL (Upstash)
# UPSTASH_REDIS_TOKEN   — Redis token
# SENTRY_DSN            — Sentry DSN
# ANTHROPIC_API_KEY     — Claude API key

[env.production]
vars = { ENVIRONMENT = "production", APP_URL = "https://seoulshop.cl", PUBLIC_API_URL = "https://api.seoulshop.cl" }

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "74adc65cf5a94d8cb90c563672f89270"

[[env.production.kv_namespaces]]
binding = "CARTS"
id = "363648fb7e044ba392e0459fcf7a0d9e"

# [[env.production.r2_buckets]]
# binding = "PDF_BUCKET"
# bucket_name = "seul-kims-pdfs-dev"

[[env.production.durable_objects.bindings]]
name = "ORDER_HUB"
class_name = "OrderHub"

[[env.production.migrations]]
tag = "v1"
new_classes = ["OrderHub"]

[[env.production.queues.producers]]
binding = "DTE_QUEUE"
queue = "seul-kims-dte"

[[env.production.queues.consumers]]
queue = "seul-kims-dte"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[env.production.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "seul-kims-email"

[[env.production.queues.consumers]]
queue = "seul-kims-email"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 2
